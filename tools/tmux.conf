# =============================================================================
# TMUX : PROFIL FULL (machine perso) - THÈME XCODE
# =============================================================================
# ~/.tmux.conf -> tools/tmux.conf ; ~/.tmux/dotfiles -> tools/tmux (install.sh)
#   tmux/common.conf  base partagée avec le profil lite
#   tmux/v32.conf     terminal-features, popups (tmux >= 3.2)
#   tmux/macos.conf   Ghostty, pbcopy (macOS seulement)
# Le profil lite (serveurs clients) utilise tmux/remote.conf, sans TPM.

source-file ~/.tmux/dotfiles/common.conf
source-file ~/.tmux/dotfiles/v32.conf
if-shell 'test "$(uname)" = Darwin' 'source-file ~/.tmux/dotfiles/macos.conf'

# Préfixe : Ctrl+a (Ctrl-b reste libre pour un tmux distant en lite)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Rechargement config : Prefix + r
bind r source-file ~/.tmux.conf \; display-message "🎉 Configuration rechargée!"

# Droite : CPU, batterie, heure, date (plugins tmux-cpu / tmux-battery)
set -g status-interval 1
set -g status-right "#[bg=#2d2d30,fg=#73c990]#[bg=#73c990,fg=#1d1d1d,bold] 󰍛 #{cpu_percentage} #[bg=#73c990,fg=#ffd60a]#[bg=#ffd60a,fg=#1d1d1d,bold] 󰁹 #{battery_percentage} #[bg=#ffd60a,fg=#bf5af2]#[bg=#bf5af2,fg=#ffffff,bold] 󰅐 %H:%M #[bg=#bf5af2,fg=#007acc]#[bg=#007acc,fg=#ffffff,bold] 📅 %d/%m "

# =============================================================================
# -- PLUGINS TPM ---------------------------------------------------------------
# =============================================================================

# Installation automatique de TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'

# Plugins essentiels
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Gestion des sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Informations système
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Utilitaires
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'sainnhe/tmux-fzf'

# Tmux Yank
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'

# Tmux Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh psql mysql sqlite3'

# Tmux Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Tmux CPU
set -g @cpu_low_fg_color '#73c990'
set -g @cpu_medium_fg_color '#ffd60a'
set -g @cpu_high_fg_color '#ff453a'

# Tmux Battery
set -g @batt_color_charge_primary_tier8 '#73c990'
set -g @batt_color_charge_primary_tier7 '#73c990'
set -g @batt_color_charge_primary_tier6 '#ffd60a'
set -g @batt_color_charge_primary_tier5 '#ffd60a'
set -g @batt_color_charge_primary_tier4 '#ff9500'
set -g @batt_color_charge_primary_tier3 '#ff9500'
set -g @batt_color_charge_primary_tier2 '#ff453a'
set -g @batt_color_charge_primary_tier1 '#ff453a'

# Tmux FZF
set -g @tmux-fzf-launch-key 'C-f'

# =============================================================================
# -- INITIALISATION ------------------------------------------------------------
# =============================================================================

display-message "🚀 Tmux configuré avec le thème Xcode - Prefix: C-a"

# Initialisation TPM (doit être en dernière ligne)
run '~/.tmux/plugins/tpm/tpm'
