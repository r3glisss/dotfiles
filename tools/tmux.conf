# =============================================================================
# TMUX CONFIGURATION MODERNE - THÈME XCODE POUR MACOS
# =============================================================================
#
# Optimisé pour: macOS + Ghostty + Thème Xcode
# Features: Interface élégante, performance, ergonomie
#
# =============================================================================

# =============================================================================
# -- CONFIGURATION DE BASE ---------------------------------------------------
# =============================================================================

# Préfixe : Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal avec support couleur complet
set -g default-terminal "xterm-ghostty"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# Performance et réactivité
set -g history-limit 100000
set -sg escape-time 0
set -g repeat-time 300
set -g display-time 1000

# Index des fenêtres et panneaux commence à 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Support souris et focus events
set -g mouse on
set -g focus-events on

# Activité et alertes
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off

# =============================================================================
# -- RACCOURCIS CLAVIER MODERNES ---------------------------------------------
# =============================================================================

# Rechargement config : Prefix + r
bind r source-file ~/.tmux.conf \; display-message "🎉 Configuration rechargée!"

# -- GESTION DES PANNEAUX --
# Division intuitive (garde le répertoire courant)
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigation vim-style
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionnement fluide (répétable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# Fermeture rapide sans confirmation
bind x kill-pane
bind X kill-window

# Zoom panneau
bind m resize-pane -Z

# -- GESTION DES FENÊTRES --
# Nouvelle fenêtre dans le répertoire courant
bind c new-window -c "#{pane_current_path}"

# Navigation rapide
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Déplacement de fenêtres
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# -- MODE COPIE VIM --
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Synchronisation des panneaux
bind s setw synchronize-panes \; display-message "Sync #{?pane_synchronized,ON,OFF}"

# =============================================================================
# -- THÈME XCODE MODERNE -----------------------------------------------------
# =============================================================================

# Couleurs Xcode Dark
XCODE_BG="#1d1d1d"
XCODE_FG="#ffffff"
XCODE_GRAY="#2d2d30"
XCODE_DARK_GRAY="#1e1e1e"
XCODE_BLUE="#007acc"
XCODE_GREEN="#73c990"
XCODE_ORANGE="#ff9500"
XCODE_RED="#ff453a"
XCODE_YELLOW="#ffd60a"
XCODE_PURPLE="#bf5af2"
XCODE_SELECTION="#264f78"
XCODE_COMMENT="#6a9955"

# Configuration générale
set -g status-style "bg=$XCODE_GRAY,fg=$XCODE_FG"
set -g status-left-length 100
set -g status-right-length 100
set -g status-position bottom
set -g status-interval 1

# Bordures des panneaux
set -g pane-border-style "fg=$XCODE_COMMENT"
set -g pane-active-border-style "fg=$XCODE_BLUE"

# Fenêtre active/inactive
setw -g window-status-style "bg=$XCODE_GRAY,fg=$XCODE_COMMENT"
setw -g window-status-current-style "bg=$XCODE_BLUE,fg=$XCODE_FG,bold"
setw -g window-status-activity-style "bg=$XCODE_ORANGE,fg=$XCODE_BG"

# Mode copie
setw -g mode-style "bg=$XCODE_SELECTION,fg=$XCODE_FG"

# Messages
set -g message-style "bg=$XCODE_BLUE,fg=$XCODE_FG,bold"
set -g message-command-style "bg=$XCODE_PURPLE,fg=$XCODE_FG,bold"

# =============================================================================
# -- BARRE DE STATUT ÉLÉGANTE ------------------------------------------------
# =============================================================================

# Partie gauche : Session et fenêtre
set -g status-left "#[bg=$XCODE_BLUE,fg=$XCODE_FG,bold]  #S #[bg=$XCODE_GRAY,fg=$XCODE_BLUE,nobold]"

# Format des fenêtres
setw -g window-status-format "#[bg=$XCODE_GRAY,fg=$XCODE_COMMENT] #I #W "
setw -g window-status-current-format "#[bg=$XCODE_BLUE,fg=$XCODE_FG,bold] #I #W #[bg=$XCODE_GRAY,fg=$XCODE_BLUE,nobold]"

# Partie droite : Informations système
set -g status-right "#[bg=$XCODE_GRAY,fg=$XCODE_GREEN]#[bg=$XCODE_GREEN,fg=$XCODE_BG,bold] 󰍛 #{cpu_percentage} #[bg=$XCODE_GREEN,fg=$XCODE_YELLOW]#[bg=$XCODE_YELLOW,fg=$XCODE_BG,bold] 󰁹 #{battery_percentage} #[bg=$XCODE_YELLOW,fg=$XCODE_PURPLE]#[bg=$XCODE_PURPLE,fg=$XCODE_FG,bold] 󰅐 %H:%M #[bg=$XCODE_PURPLE,fg=$XCODE_BLUE]#[bg=$XCODE_BLUE,fg=$XCODE_FG,bold] 📅 %d/%m "

# =============================================================================
# -- PLUGINS TPM --------------------------------------------------------------
# =============================================================================

# Installation automatique de TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# Liste des plugins
set -g @plugin 'tmux-plugins/tpm'

# Plugins essentiels
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Gestion des sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Informations système
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Utilitaires
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'sainnhe/tmux-fzf'

# =============================================================================
# -- CONFIGURATION DES PLUGINS -----------------------------------------------
# =============================================================================

# Tmux Yank (optimisé macOS)
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'

# Tmux Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh psql mysql sqlite3'

# Tmux Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Tmux CPU
set -g @cpu_low_fg_color '#73c990'
set -g @cpu_medium_fg_color '#ffd60a'
set -g @cpu_high_fg_color '#ff453a'

# Tmux Battery
set -g @batt_color_charge_primary_tier8 '#73c990'
set -g @batt_color_charge_primary_tier7 '#73c990'
set -g @batt_color_charge_primary_tier6 '#ffd60a'
set -g @batt_color_charge_primary_tier5 '#ffd60a'
set -g @batt_color_charge_primary_tier4 '#ff9500'
set -g @batt_color_charge_primary_tier3 '#ff9500'
set -g @batt_color_charge_primary_tier2 '#ff453a'
set -g @batt_color_charge_primary_tier1 '#ff453a'

# Tmux FZF
set -g @tmux-fzf-launch-key 'C-f'

# =============================================================================
# -- RACCOURCIS AVANCÉS ------------------------------------------------------
# =============================================================================

# Popup avec fzf pour sélection rapide
bind f display-popup -E -w 80% -h 60% -d '#{pane_current_path}' 'fd --type f --hidden --follow --exclude .git | fzf --reverse --preview "bat --color=always --style=numbers --line-range=:500 {}"'

# Popup pour lazygit (si installé)
bind g display-popup -E -w 90% -h 85% -d '#{pane_current_path}' 'lazygit'

# Popup pour htop
bind t display-popup -E -w 80% -h 60% 'htop'

# Session manager avec fzf
bind S display-popup -E -w 60% -h 40% 'tmux list-sessions -F "#{session_name}" | fzf --reverse | xargs tmux switch-client -t'

# Recherche dans l'historique avec fzf
bind / copy-mode \; send-keys ?

# =============================================================================
# -- OPTIMISATIONS MACOS -----------------------------------------------------
# =============================================================================

# Support du clipboard macOS
set -g set-clipboard on

# Réglages pour la performance
set -g aggressive-resize on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Désactiver les notifications et belling
set -g bell-action none
set -g visual-bell off

# =============================================================================
# -- INITIALISATION ----------------------------------------------------------
# =============================================================================

# Message de démarrage
display-message "🚀 Tmux configuré avec le thème Xcode - Prefix: C-a"

# Initialisation TPM (doit être en dernière ligne)
run '~/.tmux/plugins/tpm/tpm'
