# =============================================================================
# TMUX : OPTIONS NÉCESSITANT TMUX >= 3.2 (terminal-features, display-popup)
# =============================================================================
# Chargé seulement si la version le permet (toujours en full ; en lite selon
# la version détectée par lite/install.sh). Les popups vérifient leurs outils.

set -as terminal-features ",*:RGB"

# Fichiers : fd/fzf/bat si présents, sinon find/fzf/head
bind f display-popup -E -w 80% -h 60% -d '#{pane_current_path}' \
    'command -v fzf >/dev/null || { echo "fzf absent"; read -r _; exit; }; \
     if command -v fd >/dev/null; then fd --type f --hidden --follow --exclude .git; \
     else find . -type f -not -path "*/.git/*"; fi | \
     fzf --reverse --preview "if command -v bat >/dev/null; then bat --color=always --style=numbers --line-range=:500 {}; else head -500 {}; fi"'

# lazygit (si installé)
bind g display-popup -E -w 90% -h 85% -d '#{pane_current_path}' \
    'command -v lazygit >/dev/null && lazygit || { echo "lazygit absent"; read -r _; }'

# htop, sinon top
bind t display-popup -E -w 80% -h 60% \
    'if command -v htop >/dev/null; then htop; else top; fi'

# Choix de session (fzf), sinon l'arbre natif
bind S if-shell 'command -v fzf' \
    "display-popup -E -w 60% -h 40% 'tmux list-sessions -F \"#{session_name}\" | fzf --reverse | xargs tmux switch-client -t'" \
    'choose-tree -s'
