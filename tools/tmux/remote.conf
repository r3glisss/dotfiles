# =============================================================================
# TMUX : SERVEUR CLIENT (profil lite)
# =============================================================================
# Chargé par ~/.dotfiles-lite/tmux.conf, généré par lite/install.sh, qui
# fixe aussi default-terminal selon les terminfo du serveur.
#
# Préfixe Ctrl-b (défaut tmux) : distinct du Ctrl-a du Mac, un tmux distant
# dans le tmux local se pilote sans double préfixe.
# Copie : OSC 52 (common.conf), arrive dans le presse-papier du Mac via SSH.
# Pas de plugins TPM : rien n'est installé dans ~/.tmux du client.

set -g prefix C-b
bind C-b send-prefix

# Barre de statut : la machine en évidence (on sait où l'on tape)
set -g status-left "#[bg=#ff9500,fg=#1d1d1d,bold] 󰒋 #h #[bg=#007acc,fg=#ffffff,bold] #S #[bg=#2d2d30,fg=#007acc,nobold]"
set -g status-right "#[bg=#2d2d30,fg=#bf5af2]#[bg=#bf5af2,fg=#ffffff,bold] 󰅐 %H:%M #[bg=#bf5af2,fg=#007acc]#[bg=#007acc,fg=#ffffff,bold] 📅 %d/%m "
