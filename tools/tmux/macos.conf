# =============================================================================
# TMUX : SPÉCIFIQUE macOS (Ghostty, pbcopy)
# =============================================================================
# Chargé par tools/tmux.conf seulement sous macOS.

set -g default-terminal "xterm-ghostty"

# Copie dans le presse-papier macOS
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Logo Apple (police Apple / Nerd Font du Mac)
set -g status-left "#[bg=#007acc,fg=#ffffff,bold]  #S #[bg=#2d2d30,fg=#007acc,nobold]"
