# =============================================================================
# TMUX : BASE COMMUNE (full et lite, tmux >= 3.0)
# =============================================================================
# Chargée par tools/tmux.conf (full) et ~/.dotfiles-lite/tmux.conf (lite).
# Le préfixe, le terminal et la copie dépendent de la machine : voir
# tools/tmux.conf, tools/tmux/macos.conf, tools/tmux/remote.conf.

# Défaut sûr (terminfo présente partout) ; macos.conf / lite le remplacent
set -g default-terminal "screen-256color"
set -as terminal-overrides ",*:Tc"

# Performance et réactivité
set -g history-limit 100000
set -sg escape-time 0
set -g repeat-time 300
set -g display-time 1000

# Index des fenêtres et panneaux commence à 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Support souris et focus events
set -g mouse on
set -g focus-events on

# Activité et alertes
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# Renommage automatique et redimensionnement
set -g aggressive-resize on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# =============================================================================
# -- RACCOURCIS ----------------------------------------------------------------
# =============================================================================

# -- GESTION DES PANNEAUX --
# Division intuitive (garde le répertoire courant)
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigation vim-style
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionnement fluide (répétable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# Fermeture rapide sans confirmation
bind x kill-pane
bind X kill-window

# Zoom panneau
bind m resize-pane -Z

# -- GESTION DES FENÊTRES --
bind c new-window -c "#{pane_current_path}"
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# -- MODE COPIE VIM --
# Copie par défaut : OSC 52, le terminal (même à travers SSH) reçoit la
# sélection dans son presse-papier. macos.conf la remplace par pbcopy.
setw -g mode-keys vi
set -g set-clipboard on
bind Escape copy-mode
bind / copy-mode \; send-keys ?
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Synchronisation des panneaux
bind s setw synchronize-panes \; display-message "Sync #{?pane_synchronized,ON,OFF}"

# =============================================================================
# -- THÈME XCODE ---------------------------------------------------------------
# =============================================================================
# Couleurs : #1d1d1d fond, #2d2d30 gris, #007acc bleu, #73c990 vert,
# #ff9500 orange, #ffd60a jaune, #bf5af2 violet, #264f78 sélection,
# #6a9955 commentaire

set -g status-style "bg=#2d2d30,fg=#ffffff"
set -g status-left-length 100
set -g status-right-length 100
set -g status-position bottom
set -g status-interval 5

set -g pane-border-style "fg=#6a9955"
set -g pane-active-border-style "fg=#007acc"

setw -g window-status-style "bg=#2d2d30,fg=#6a9955"
setw -g window-status-current-style "bg=#007acc,fg=#ffffff,bold"
setw -g window-status-activity-style "bg=#ff9500,fg=#1d1d1d"

setw -g mode-style "bg=#264f78,fg=#ffffff"
set -g message-style "bg=#007acc,fg=#ffffff,bold"
set -g message-command-style "bg=#bf5af2,fg=#ffffff,bold"

set -g status-left "#[bg=#007acc,fg=#ffffff,bold] #S #[bg=#2d2d30,fg=#007acc,nobold]"
setw -g window-status-format "#[bg=#2d2d30,fg=#6a9955] #I #W "
setw -g window-status-current-format "#[bg=#007acc,fg=#ffffff,bold] #I #W #[bg=#2d2d30,fg=#007acc,nobold]"

# Droite : machine, heure, date (full la remplace par CPU / batterie)
set -g status-right "#[bg=#2d2d30,fg=#73c990]#[bg=#73c990,fg=#1d1d1d,bold] 󰒋 #h #[bg=#73c990,fg=#bf5af2]#[bg=#bf5af2,fg=#ffffff,bold] 󰅐 %H:%M #[bg=#bf5af2,fg=#007acc]#[bg=#007acc,fg=#ffffff,bold] 📅 %d/%m "
